name: Tests

on:
  push:
    branches: [main, async-http-parity-local]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install library and validation tools
        run: python -m pip install -e . pytest pytest-asyncio ruff mypy build twine
      - name: Run tests
        run: python -m pytest -q
      - name: Check new API and tests
        run: |
          python -m ruff check iammeter/__init__.py iammeter/async_client.py iammeter/connection.py iammeter/models.py setup.py tests
          python -m ruff format --check iammeter/__init__.py iammeter/async_client.py iammeter/connection.py iammeter/models.py tests
          python -m mypy --strict --follow-imports=silent iammeter/__init__.py iammeter/async_client.py iammeter/connection.py iammeter/models.py
      - name: Validate distribution
        run: |
          python -m build
          python -m twine check dist/*
          python -m pip check
