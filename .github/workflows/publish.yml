name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full commit SHA from main to release
        required: true
        default: 06e3541da79b3f892613e007c6d3f9182a318eba
      version:
        description: Distribution version to verify
        required: true
        default: 0.3.0
      publish:
        description: Upload the verified distributions to PyPI
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Verify release source
        env:
          RELEASE_COMMIT: ${{ inputs.source_commit }}
        run: |
          python -c 'import os, re; assert re.fullmatch(r"[0-9a-f]{40}", os.environ["RELEASE_COMMIT"])'
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main
      - name: Test and build
        run: |
          python -m pip install -e . pytest pytest-asyncio build twine
          python -m pytest -q
          python -m build
          python -m twine check dist/*
      - name: Verify distribution identity
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ inputs.source_commit }}
        run: |
          python - <<'PY'
          import email
          import os
          import pathlib
          import zipfile

          wheels = list(pathlib.Path("dist").glob("*.whl"))
          assert len(wheels) == 1
          with zipfile.ZipFile(wheels[0]) as archive:
              metadata_path = next(name for name in archive.namelist() if name.endswith(".dist-info/METADATA"))
              metadata = email.message_from_bytes(archive.read(metadata_path))
          assert metadata["Name"] == "iammeter"
          assert metadata["Version"] == os.environ["RELEASE_VERSION"]
          print("Verified", metadata["Name"], metadata["Version"], "from", os.environ["RELEASE_COMMIT"])
          PY
          sha256sum dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/iammeter
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
